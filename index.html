            "Lynchburg city": { pop: 79009, prisoners: 194 },
            "Manassas city": { pop: 42772, prisoners: 43 },
            "Manassas Park city": { pop: 17219, prisoners: 12 },
            "Martinsville city": { pop: 13485, prisoners: 73 },
            "Newport News city": { pop: 186247, prisoners: 399 },
            "Norfolk city": { pop: 238005, prisoners: 803 },
            "Norton city": { pop: 3687, prisoners: 14 },
            "Petersburg city": { pop: 33458, prisoners: 168 },
            "Poquoson city": { pop: 12460, prisoners: 7 },
            "Portsmouth city": { pop: 97915, prisoners: 393 },
            "Radford city": { pop: 16070, prisoners: 24 },
            "Richmond city": { pop: 226610, prisoners: 756 },
            "Roanoke city": { pop: 100011, prisoners: 316 },
            "Salem city": { pop: 25346, prisoners: 36 },
            "Staunton city": { pop: 25750, prisoners: 74 },
            "Suffolk city": { pop: 94324, prisoners: 241 },
            "Virginia Beach city": { pop: 459470, prisoners: 552 },
            "Waynesboro city": { pop: 22196, prisoners: 73 },
            "Williamsburg city": { pop: 15425, prisoners: 19 },
            "Winchester city": { pop: 28120, prisoners: 46 },
        };

        // --- 2. CONFIG: Region Mapping & Recalculation ---

        // Crosswalk: Simple mapping of key counties to regions to ensure the merge works
        function getRegionID(countyName) {
            const map = {
                "Lee":1,"Scott":1,"Wise":1,"Dickenson":1,"Buchanan":1,"Russell":1,"Tazewell":1,"Smyth":1,"Washington":1,"Bristol city":1,"Norton city":1,
                "Bland":2,"Wythe":2,"Grayson":2,"Carroll":2,"Pulaski":2,"Montgomery":2,"Giles":2,"Floyd":2,"Radford city":2,"Galax city":2,"Roanoke":2,"Roanoke city":2,"Salem city":2,"Botetourt":2,"Craig":2,"Alleghany":2,"Covington city":2,
                "Patrick":3,"Henry":3,"Franklin":3,"Pittsylvania":3,"Halifax":3,"Mecklenburg":3,"Brunswick":3,"Martinsville city":3,"Danville city":3,"Amelia":3,"Nottoway":3,"Lunenburg":3,"Prince Edward":3,"Charlotte":3,"Buckingham":3,"Cumberland":3,
                "Greensville":4,"Sussex":4,"Surry":4,"Prince George":4,"Dinwiddie":4,"Chesterfield":4,"Henrico":4,"Hanover":4,"Goochland":4,"Powhatan":4,"New Kent":4,"Charles City":4,"Hopewell city":4,"Petersburg city":4,"Colonial Heights city":4,"Richmond city":4,"Emporia city":4,
                "James City":5,"York":5,"Gloucester":5,"Isle of Wight":5,"Suffolk city":5,"Chesapeake city":5,"Virginia Beach city":5,"Norfolk city":5,"Portsmouth city":5,"Hampton city":5,"Newport News city":5,"Williamsburg city":5,"Poquoson city":5,"Southampton":5,"Franklin city":5,
                "Westmoreland":6,"Northumberland":6,"Richmond":6,"Lancaster":6,"Essex":6,"Middlesex":6,"Mathews":6,"King George":6,"Caroline":6,"King William":6,"King and Queen":6,"Spotsylvania":6,"Stafford":6,"Fredericksburg city":6,
                "Fairfax":7,"Arlington":7,"Prince William":7,"Loudoun":7,"Fauquier":7,"Alexandria city":7,"Falls Church city":7,"Manassas city":7,"Manassas Park city":7,"Fairfax city":7,
                "Clarke":8,"Frederick":8,"Warren":8,"Shenandoah":8,"Page":8,"Rockingham":8,"Augusta":8,"Highland":8,"Bath":8,"Rockbridge":8,"Winchester city":8,"Harrisonburg city":8,"Staunton city":8,"Waynesboro city":8,"Lexington city":8,"Buena Vista city":8,
                "Albemarle":9,"Greene":9,"Madison":9,"Culpeper":9,"Orange":9,"Louisa":9,"Fluvanna":9,"Nelson":9,"Appomattox":9,"Amherst":9,"Bedford":9,"Campbell":9,"Charlottesville city":9,"Lynchburg city":9,"Rappahannock":9
            };
            return map[countyName] || 4; 
        }

        // --- RECALCULATE REGION STATS BASED ON REAL DATA ---
        // We do this dynamically so your region view matches your new CSV data
        let regionData = [
            { id: 1, name: "Southwest Virginia", employers: ["Goodyear", "Utility Trailer"], training: ["Mountain Empire CC", "Red Onion"] },
            { id: 2, name: "New River Valley", employers: ["Volvo Group", "Cornerstone"], training: ["New River CC", "Bland CC"] },
            { id: 3, name: "Southern Virginia", employers: ["Goodyear", "Microsoft"], training: ["GO TEC", "Danville CC"] },
            { id: 4, name: "Richmond / Crater", employers: ["VCU Health", "Capital One"], training: ["CCWA", "Sussex State Prison"] },
            { id: 5, name: "Hampton Roads", employers: ["Newport News Shipbuilding", "NASA"], training: ["Tidewater CC", "Deerfield CC"] },
            { id: 6, name: "Mary Ball Washington", employers: ["WestRock", "Ballard Fish"], training: ["Rappahannock CC", "Haynesville CC"] },
            { id: 7, name: "Northern Virginia", employers: ["Amazon", "Booz Allen"], training: ["NOVA CC", "Coffeewood CC"] },
            { id: 8, name: "Shenandoah Valley", employers: ["Hershey", "Merck"], training: ["Blue Ridge CC", "Augusta CC"] },
            { id: 9, name: "Piedmont Corridor", employers: ["UVA", "Afton Scientific"], training: ["PVCC", "Fluvanna CCW"] }
        ];

        // Init stats
        regionData.forEach(r => r.stats = { jobs: 0, returnees: 0, gap: 0 });

        // Loop through all counties and sum up to regions
        Object.keys(countyMockData).forEach(countyName => {
            const rId = getRegionID(countyName);
            const region = regionData.find(r => r.id === rId);
            if(region) {
                // Add Prisoners
                region.stats.returnees += countyMockData[countyName].prisoners;
                
                // Add Jobs
                // Match key format ("Accomack" vs "Accomack County")
                const jobKey = countyName.replace(" County", "").replace(" City", "");
                const jobInfo = countyJobData[jobKey];
                if(jobInfo) {
                    region.stats.jobs += jobInfo.jobs;
                }
            }
        });

        // Calc Gap
        regionData.forEach(r => {
             // Gap = Jobs per Returnee
             r.stats.gap = r.stats.returnees > 0 ? (r.stats.jobs / r.stats.returnees).toFixed(1) : 0;
        });


        // --- 3. METRIC CONFIGURATION ---
        const countyMetrics = [
            { id: 'pop', label: 'Population', accessor: d => d.pop || 0, scheme: d3.schemeBlues[9] },
            { id: 'prisoners', label: 'Est. Returnees', accessor: d => d.prisoners || 0, scheme: d3.schemeReds[9] },
            { id: 'jobs', label: '2nd Chance Jobs', accessor: d => d.jobs || 0, scheme: d3.schemeGreens[9] }
        ];

        const regionMetrics = [
            { id: 'gap', label: 'Opportunity Gap (Jobs/Returnee)', accessor: d => d.stats.gap, scheme: d3.schemeRdYlGn[9] }, 
            { id: 'returnees', label: 'Total Returnees', accessor: d => d.stats.returnees, scheme: d3.schemePurples[9] },
            { id: 'jobs', label: 'Total 2nd Chance Jobs', accessor: d => d.stats.jobs, scheme: d3.schemeGreens[9] }
        ];

        // State
        let currentView = 'county'; // 'county' or 'region'
        let currentMetric = countyMetrics[1]; // Default to Returnees
        let geoData = null; // Store fetched TopoJSON
        let activeSelection = d3.select(null);

        // --- 4. D3 SETUP ---
        const svg = d3.select("#map");
        const container = svg.node().parentElement;
        const width = container.clientWidth;
        const height = container.clientHeight;
        
        const path = d3.geoPath();
        const g = svg.append("g");
        const zoom = d3.zoom().scaleExtent([1, 8]).on("zoom", e => g.attr("transform", e.transform));
        svg.call(zoom);

        // --- 5. MAIN RENDER LOGIC ---
        
        // Load Map Data
        d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/counties-10m.json").then(us => {
            // Filter for Virginia (FIPS 51)
            const vaFeatures = topojson.feature(us, us.objects.counties).features.filter(d => d.id.startsWith("51"));
            
            // Enrich GeoJSON with Data
            vaFeatures.forEach(f => {
                const name = f.properties.name;
                const regionId = getRegionID(name);

                // Get Prisoner Data
                const popData = countyMockData[name] || { pop: 0, prisoners: 0 };
                
                // Get Job Data (Clean Key)
                const key = name.replace(" County", "").replace(" City", ""); 
                const jobData = countyJobData[key] || { jobs: 0, total_jobs: 0, share: 0, top_sector: "N/A" };

                // Merge
                f.properties.countyData = { ...popData, ...jobData, name: name };
                f.properties.regionId = regionId;
            });

            // Store for toggling
            geoData = {
                raw: us,
                counties: vaFeatures,
                // Create Merged Regions using TopoJSON mesh/merge
                regions: d3.range(1, 10).map(rId => {
                    const merged = topojson.merge(us, us.objects.counties.geometries.filter(d => {
                        // Check if this geometry belongs to VA and this region
                        if (!d.id.startsWith("51")) return false;
                        const props = vaFeatures.find(f => f.id === d.id)?.properties;
                        return props && props.regionId === rId;
                    }));
                    merged.properties = regionData.find(r => r.id === rId); // Attach region stats
                    return merged;
                })
            };

            // Calculate Projection to fit VA
            const projection = d3.geoIdentity().reflectY(true);
            path.projection(projection);
            const b = path.bounds({ type: "FeatureCollection", features: vaFeatures });
            const s = 0.95 / Math.max((b[1][0] - b[0][0]) / width, (b[1][1] - b[0][1]) / height);
            const t = [(width - s * (b[1][0] + b[0][0])) / 2, (height - s * (b[1][1] + b[0][1])) / 2];
            projection.scale(s).translate(t);

            // Initial Draw
            updateView();
        });

        // --- 6. FUNCTIONS ---

        function updateView() {
            // Update Toggle Button Styles
            const btnC = d3.select("#btn-county");
            const btnR = d3.select("#btn-region");
            if (currentView === 'county') {
                btnC.classed("bg-white shadow-sm text-slate-900", true).classed("text-slate-600 hover:text-slate-900", false);
                btnR.classed("bg-white shadow-sm text-slate-900", false).classed("text-slate-600 hover:text-slate-900", true);
                currentMetric = countyMetrics[1]; 
            } else {
                btnR.classed("bg-white shadow-sm text-slate-900", true).classed("text-slate-600 hover:text-slate-900", false);
                btnC.classed("bg-white shadow-sm text-slate-900", false).classed("text-slate-600 hover:text-slate-900", true);
                currentMetric = regionMetrics[0]; 
            }

            renderMap();
            renderControls();
            resetInfo();
        }

        function renderMap() {
            const dataToDraw = currentView === 'county' ? geoData.counties : geoData.regions;

            const values = dataToDraw.map(d => 
                currentView === 'county' ? currentMetric.accessor(d.properties.countyData) : currentMetric.accessor(d.properties)
            );
            
            const colorScale = d3.scaleQuantile()
                .domain(values)
                .range(currentMetric.scheme);

            const paths = g.selectAll("path").data(dataToDraw);

            paths.exit().remove();

            paths.enter().append("path")
                .merge(paths)
                .attr("d", path)
                .attr("class", "map-path")
                .attr("fill", d => {
                    const val = currentView === 'county' ? currentMetric.accessor(d.properties.countyData) : currentMetric.accessor(d.properties);
                    return colorScale(val);
                })
                .on("click", clicked);
            
            updateLegend(colorScale);
        }

        function clicked(event, d) {
            const props = d.properties;
            
            // Zoom Logic
            const [[x0, y0], [x1, y1]] = path.bounds(d);
            event.stopPropagation();
            svg.transition().duration(750).call(
                zoom.transform,
                d3.zoomIdentity
                    .translate(width / 2, height / 2)
                    .scale(Math.min(8, 0.9 / Math.max((x1 - x0) / width, (y1 - y0) / height)))
                    .translate(-(x0 + x1) / 2, -(y0 + y1) / 2)
            );
            d3.select("#reset-zoom").classed("opacity-0 pointer-events-none", false);

            // Highlight
            if (activeSelection) activeSelection.classed("active", false);
            activeSelection = d3.select(this).classed("active", true);

            // Update Info Panel
            const panel = d3.select("#info-panel");
            panel.html(""); // Clear

            if (currentView === 'county') {
                const data = props.countyData;
                panel.html(`
                    <div class="mb-4">
                        <h2 class="text-2xl font-bold text-slate-800">${data.name}</h2>
                        <span class="inline-block px-2 py-1 text-xs font-semibold bg-slate-200 rounded mt-1">Region ${props.regionId}</span>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div class="bg-blue-50 p-3 rounded">
                            <span class="block text-xs text-blue-500 uppercase">Population</span>
                            <span class="text-xl font-bold text-blue-900">${d3.format(",")(data.pop)}</span>
                        </div>
                        <div class="bg-red-50 p-3 rounded">
                            <span class="block text-xs text-red-500 uppercase">Est. Returnees</span>
                            <span class="text-xl font-bold text-red-900">${d3.format(",")(data.prisoners)}</span>
                        </div>
                    </div>

                     <div class="bg-green-50 p-4 rounded border-l-4 border-green-500">
                        <h3 class="font-bold text-green-900 mb-2">Second Chance Economy</h3>
                        <div class="flex justify-between text-sm mb-1">
                            <span class="text-green-700">Accessible Jobs:</span>
                            <span class="font-bold">${d3.format(",")(data.jobs)}</span>
                        </div>
                        <div class="flex justify-between text-sm mb-1">
                            <span class="text-green-700">Share of Economy:</span>
                            <span class="font-bold">${data.share}%</span>
                        </div>
                        <div class="mt-2 text-xs text-green-600">
                            Top Sector: <span class="font-semibold uppercase">${data.top_sector}</span>
                        </div>
                    </div>
                `);
            } else {
                // Region View
                panel.html(`
                    <div class="mb-4 border-b pb-4">
                        <h2 class="text-2xl font-bold text-slate-800">Region ${props.id}</h2>
                        <h3 class="text-lg text-slate-600">${props.name}</h3>
                    </div>
                    
                    <div class="grid grid-cols-3 gap-2 mb-6">
                        <div class="bg-slate-50 p-2 rounded text-center">
                            <div class="text-xs text-slate-500">Gap Score</div>
                            <div class="font-bold text-lg ${props.stats.gap > 2.0 ? 'text-green-600' : 'text-red-600'}">${props.stats.gap}</div>
                        </div>
                        <div class="bg-slate-50 p-2 rounded text-center">
                            <div class="text-xs text-slate-500">Returnees</div>
                            <div class="font-bold text-lg">${d3.format(",")(props.stats.returnees)}</div>
                        </div>
                        <div class="bg-slate-50 p-2 rounded text-center">
                            <div class="text-xs text-slate-500">Jobs</div>
                            <div class="font-bold text-lg">${d3.format(",")(props.stats.jobs)}</div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <h4 class="font-bold text-xs uppercase text-slate-400 mb-2">Top Employers</h4>
                        <ul class="text-sm space-y-1">
                            ${props.employers.map(e => `<li class="flex items-center"><span class="w-1.5 h-1.5 bg-green-500 rounded-full mr-2"></span>${e}</li>`).join('')}
                        </ul>
                    </div>

                    <div>
                        <h4 class="font-bold text-xs uppercase text-slate-400 mb-2">Training Programs</h4>
                        <ul class="text-sm space-y-1">
                             ${props.training.map(t => `<li class="flex items-center"><span class="w-1.5 h-1.5 bg-blue-500 rounded-full mr-2"></span>${t}</li>`).join('')}
                        </ul>
                    </div>
                `);
            }
        }

        function resetInfo() {
            if (activeSelection) activeSelection.classed("active", false);
            activeSelection = null;
            
            svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity);
            d3.select("#reset-zoom").classed("opacity-0 pointer-events-none", true);

            d3.select("#info-panel").html(`
                <div class="text-center p-6 border-2 border-dashed border-slate-300 rounded-lg bg-slate-50">
                    <h2 class="text-lg font-semibold text-slate-700">Select an Area</h2>
                    <p class="text-sm text-slate-500 mt-1">Click a ${currentView} on the map to view statistics.</p>
                </div>
            `);
        }

        function renderControls() {
            const container = d3.select("#controls").html("");
            const metrics = currentView === 'county' ? countyMetrics : regionMetrics;

            metrics.forEach(m => {
                const row = container.append("div").attr("class", "flex items-center mb-2 cursor-pointer");
                const input = row.append("input")
                    .attr("type", "radio")
                    .attr("name", "metric")
                    .property("checked", m.id === currentMetric.id)
                    .on("change", () => {
                        currentMetric = m;
                        renderMap();
                    });
                row.append("span").attr("class", "ml-2 text-sm text-slate-700").text(m.label);
            });
        }

        function updateLegend(scale) {
            const container = d3.select("#legend").html("");
            const range = scale.range();
            
            const legendRow = container.append("div").attr("class", "flex w-full h-3 rounded overflow-hidden mb-1");
            range.forEach(color => {
                legendRow.append("div").style("background", color).style("flex", 1);
            });

            const labels = container.append("div").attr("class", "flex justify-between text-xs text-slate-500");
            labels.append("span").text("Low");
            labels.append("span").text("High");
        }

        // --- 7. EVENT LISTENERS ---
        d3.select("#btn-county").on("click", () => { currentView = 'county'; updateView(); });
        d3.select("#btn-region").on("click", () => { currentView = 'region'; updateView(); });
        d3.select("#reset-zoom").on("click", resetInfo);

    </script>
</body>
